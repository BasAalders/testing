<style>
/* Layout: a phone-first IDE. Title bar, tabs, full-bleed editor, a symbol key row above the
   on-screen keyboard and a status bar. Explorer slides in from the left; preview is a full sheet. */
:root {
  --bg: #1b1d23;
  --chrome: #15171c;
  --panel: #20232a;
  --raise: #2a2e37;
  --line: #2f333d;
  --fg: #d4d7de;
  --muted: #8b919e;
  --gutter: #5a6070;
  --accent: #4c9bf0;
  --accent-soft: rgba(76, 155, 240, .16);
  --status: #2463b0;
  --status-fg: #ffffff;
  --sel: #2c4a72;
  --activeline: #22252c;
  --find: rgba(234, 180, 60, .34);
  --danger: #f07070;
  --warn: #e3b55a;
  --ok: #62c48d;
  --scrim: rgba(5, 6, 8, .55);
  --shadow: 0 12px 40px rgba(0, 0, 0, .45);
  --preview-bg: #ffffff;

  --s-kw: #c586c0; --s-str: #e2a27a; --s-num: #b5cea8; --s-com: #6f9160;
  --s-def: #dcd38a; --s-var: #9cd0f0; --s-tag: #6aa7e8; --s-attr: #9cd0f0;
  --s-type: #4ec9b0; --s-atom: #6aa7e8; --s-meta: #b0b6c2; --s-bracket: #d4b44a;
  --s-err: #f07070; --s-head: #6aa7e8; --s-link: #4ec9b0;

  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --chrome: #eef0f3; --panel: #f6f7f9; --raise: #e3e6eb; --line: #d8dce2;
    --fg: #22252b; --muted: #5f6673; --gutter: #9aa1ad; --accent: #1f6fd1;
    --accent-soft: rgba(31, 111, 209, .12); --status: #1f6fd1; --sel: #cfe0f7;
    --activeline: #f2f5fa; --find: rgba(240, 190, 40, .45); --danger: #c63b3b; --warn: #9a6a00;
    --ok: #23874f; --scrim: rgba(20, 24, 32, .35); --shadow: 0 12px 40px rgba(20, 30, 50, .18);
    --s-kw: #a626a4; --s-str: #a3471a; --s-num: #0b7a55; --s-com: #4f7a3a; --s-def: #7a5e10;
    --s-var: #1d4f91; --s-tag: #8a2121; --s-attr: #b03a2e; --s-type: #18797a; --s-atom: #1f5fbf;
    --s-meta: #5f6673; --s-bracket: #8a6d00; --s-err: #c63b3b; --s-head: #1f5fbf; --s-link: #18797a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --chrome: #eef0f3; --panel: #f6f7f9; --raise: #e3e6eb; --line: #d8dce2;
  --fg: #22252b; --muted: #5f6673; --gutter: #9aa1ad; --accent: #1f6fd1;
  --accent-soft: rgba(31, 111, 209, .12); --status: #1f6fd1; --sel: #cfe0f7;
  --activeline: #f2f5fa; --find: rgba(240, 190, 40, .45); --danger: #c63b3b; --warn: #9a6a00;
  --ok: #23874f; --scrim: rgba(20, 24, 32, .35); --shadow: 0 12px 40px rgba(20, 30, 50, .18);
  --s-kw: #a626a4; --s-str: #a3471a; --s-num: #0b7a55; --s-com: #4f7a3a; --s-def: #7a5e10;
  --s-var: #1d4f91; --s-tag: #8a2121; --s-attr: #b03a2e; --s-type: #18797a; --s-atom: #1f5fbf;
  --s-meta: #5f6673; --s-bracket: #8a6d00; --s-err: #c63b3b; --s-head: #1f5fbf; --s-link: #18797a;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--ui); }
button { font: inherit; color: inherit; }
input, select { font: inherit; }
button:focus-visible, input:focus-visible, .row:focus-visible, .tab:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
[hidden] { display: none !important; }

#app { position: fixed; left: 0; right: 0; top: 0; height: 100%; display: flex; flex-direction: column; background: var(--bg); }

/* Title bar */
.topbar {
  display: flex; align-items: center; gap: 2px; flex: none;
  padding: env(safe-area-inset-top, 0px) max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px));
  min-height: calc(48px + env(safe-area-inset-top, 0px));
  background: var(--chrome); border-bottom: 1px solid var(--line);
}
.icon-btn {
  flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px;
  border: 0; border-radius: 10px; background: transparent; color: var(--fg); cursor: pointer;
}
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.run { color: var(--ok); }
.title {
  flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px;
  margin: 0 4px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--muted); cursor: pointer; text-align: left;
}
.title svg { width: 15px; height: 15px; flex: none; }
.title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.title b { color: var(--fg); font-weight: 500; }

/* Tabs */
.tabs { display: flex; flex: none; overflow-x: auto; background: var(--chrome); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: flex; align-items: center; gap: 6px; height: 38px; max-width: 200px;
  padding: 0 2px 0 12px; border: 0; border-right: 1px solid var(--line); background: transparent;
  color: var(--muted); font-size: 13px; cursor: pointer;
}
.tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.active { background: var(--bg); color: var(--fg); box-shadow: inset 0 2px 0 var(--accent); }
.tab .x { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--muted); }
.tab .x:active { background: var(--raise); }
.tab .x svg { width: 14px; height: 14px; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--muted); }

/* Editor */
#editorWrap { position: relative; flex: 1; min-height: 0; }
#editorWrap .CodeMirror { height: 100%; }
.empty {
  position: absolute; inset: 0; z-index: 8; display: grid; place-content: center; gap: 14px;
  padding: 24px 16px; text-align: center; background: var(--bg); color: var(--muted);
}
.empty h2 { margin: 0; color: var(--fg); font-size: 17px; font-weight: 600; }
.empty p { margin: 0; max-width: 32ch; }
.empty .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
  padding: 0 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--raise);
  color: var(--fg); font-size: 14px; font-weight: 500; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--status-fg); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--status-fg); }
.btn:active { filter: brightness(.92); }
.btn svg { width: 16px; height: 16px; }

/* Find bar */
.findbar { flex: none; display: grid; gap: 6px; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); }
.findrow { display: flex; align-items: center; gap: 4px; }
.findrow input {
  flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg); font: 13px var(--mono);
}
.findrow input:focus { border-color: var(--accent); outline: none; }
.findrow .count { flex: none; min-width: 52px; text-align: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.findrow .icon-btn { width: 36px; height: 36px; }
.findrow .icon-btn svg { width: 18px; height: 18px; }
.findrow .small { height: 36px; min-height: 36px; padding: 0 10px; font-size: 13px; }

/* Symbol keys */
.keys { flex: none; display: flex; gap: 5px; overflow-x: auto; padding: 6px 8px; background: var(--chrome); border-top: 1px solid var(--line); scrollbar-width: none; }
.keys::-webkit-scrollbar { display: none; }
.key {
  flex: none; min-width: 40px; height: 38px; padding: 0 9px; border: 0; border-radius: 7px;
  background: var(--raise); color: var(--fg); font: 500 15px var(--mono); cursor: pointer; user-select: none;
  -webkit-user-select: none; touch-action: pan-x;
}
.key.wide { font: 500 12px var(--ui); letter-spacing: .02em; }
.key.pressed { background: var(--accent); color: var(--status-fg); }

/* Status bar */
.statusbar {
  flex: none; display: flex; align-items: center; gap: 2px; overflow: hidden;
  min-height: calc(26px + env(safe-area-inset-bottom, 0px));
  padding: 0 max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px));
  background: var(--status); color: var(--status-fg); font-size: 12px; font-variant-numeric: tabular-nums;
}
#app.kb .statusbar { padding-bottom: 0; min-height: 26px; }
.statusbar button { height: 26px; padding: 0 7px; border: 0; background: transparent; color: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; border-radius: 4px; }
.statusbar button:active { background: rgba(255, 255, 255, .18); }
.statusbar .spacer { flex: 1; }

/* Explorer drawer */
.drawer { position: fixed; inset: 0; z-index: 20; visibility: hidden; }
.drawer.open { visibility: visible; }
.drawer .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s; }
.drawer.open .scrim { opacity: 1; }
.drawer .panel {
  position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 360px); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
  background: var(--panel); border-right: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(-102%); transition: transform .22s ease;
}
.drawer.open .panel { transform: none; }
.panel-head { display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--line); }
.eyebrow { flex: 1; margin: 0; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
.panel-head .icon-btn { width: 40px; height: 40px; }
.panel-head .icon-btn svg { width: 19px; height: 19px; }
.tree { flex: 1; overflow-y: auto; padding: 6px 0 16px; }
.row {
  display: flex; align-items: center; gap: 7px; width: 100%; min-height: 38px; padding: 0 4px 0 0;
  border: 0; background: transparent; color: var(--fg); font-size: 14px; text-align: left; cursor: pointer;
}
.row:active { background: var(--raise); }
.row.active { background: var(--accent-soft); }
.row .chev { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform .15s; }
.row.expanded .chev { transform: rotate(90deg); }
.row .ficon { width: 17px; height: 17px; flex: none; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .more { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: var(--muted); flex: none; }
.row .more svg { width: 17px; height: 17px; }
.panel-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }
.panel-foot strong { color: var(--fg); font-weight: 500; }

/* Bottom sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet {
  width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
}
.sheet h3 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.5; }
.sheet .field {
  width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg); font: 15px var(--mono);
}
.sheet .field:focus { outline: none; border-color: var(--accent); }
.sheet .err { color: var(--danger); font-size: 13px; min-height: 18px; }
.sheet .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.menu { display: flex; flex-direction: column; margin: 0 -8px; }
.menu button {
  display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border: 0; border-radius: 10px;
  background: transparent; color: var(--fg); font-size: 15px; text-align: left; cursor: pointer;
}
.menu button:active { background: var(--raise); }
.menu button svg { width: 19px; height: 19px; color: var(--muted); flex: none; }
.menu button.danger, .menu button.danger svg { color: var(--danger); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; }
.setting > span { color: var(--fg); font-size: 15px; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg button { min-width: 44px; height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--raise); color: var(--fg); font-weight: 500; }
.seg output { display: inline-grid; place-items: center; min-width: 40px; font-variant-numeric: tabular-nums; }
.sheet .note { font-size: 12.5px; }

/* Command palette */
.palette-wrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
.palette {
  position: absolute; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); max-width: 620px; margin: 0 auto;
  display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
}
.palette input {
  height: 46px; margin: 8px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 8px;
  background: var(--bg); color: var(--fg); font: 15px var(--mono); outline: none;
}
.palette .list { max-height: min(52vh, 420px); overflow-y: auto; padding: 0 6px 6px; }
.palette .item {
  display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 42px; padding: 8px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--fg); font-size: 14px; text-align: left; cursor: pointer;
}
.palette .item.sel { background: var(--accent-soft); }
.palette .item small { margin-left: auto; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.palette .hint { padding: 4px 16px 10px; color: var(--muted); font-size: 12px; }

/* Preview sheet */
.preview { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
.preview-head {
  display: flex; align-items: center; gap: 4px; flex: none;
  padding: env(safe-area-inset-top, 0px) max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px));
  min-height: calc(48px + env(safe-area-inset-top, 0px)); background: var(--chrome); border-bottom: 1px solid var(--line);
}
.ptabs { flex: 1; display: flex; gap: 4px; min-width: 0; }
.ptab { height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; }
.ptab.on { background: var(--raise); color: var(--fg); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: var(--status-fg); font-size: 11px; font-variant-numeric: tabular-nums; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#frame { flex: 1; width: 100%; border: 0; background: var(--preview-bg); }
.pfile { flex: none; padding: 5px 12px; color: var(--muted); font: 12px var(--mono); border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; font: 12.5px/1.5 var(--mono); }
.console .ln { padding: 4px 12px; border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
.console .ln.warn { color: var(--warn); }
.console .ln.error { color: var(--danger); }
.console .ln.result { color: var(--muted); }
.console .ln.input { color: var(--accent); }
.console .none { padding: 20px 16px; color: var(--muted); font-family: var(--ui); }
.cin { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel); }
.cin span { color: var(--accent); font: 600 14px var(--mono); padding-left: 4px; }
.cin input { flex: 1; min-width: 0; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: 13px var(--mono); }
.cin input:focus { outline: none; border-color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 13.5px; box-shadow: var(--shadow);
  transform: translateX(-50%); transition: opacity .2s; pointer-events: none;
}

/* CodeMirror 5.65.16 core layout (inlined; MIT licensed) */

  padding: 0 8px 0 6px; border-radius: 0; border-width: 0; background: transparent; font-family: inherit; font-size: inherit;

.CodeMirror-vscrollbar, .CodeMirror-hscrollbar, .CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler { position: absolute; z-index: 6; display: none; outline: none; }
.CodeMirror-vscrollbar { right: 0; top: 0; overflow-x: hidden; overflow-y: scroll; }
.CodeMirror-hscrollbar { bottom: 0; left: 0; overflow-y: hidden; overflow-x: scroll; }
.CodeMirror-scrollbar-filler { right: 0; bottom: 0; }

.CodeMirror-gutter { white-space: normal; height: 100%; display: inline-block; vertical-align: top; margin-bottom: -50px; }
.CodeMirror-gutter-wrapper { position: absolute; z-index: 4; background: none !important; border: none !important; }
.CodeMirror-gutter-background { position: absolute; top: 0; bottom: 0; z-index: 4; }

.CodeMirror-gutter-wrapper ::selection { background-color: transparent; }
.CodeMirror-linenumber { padding: 0 6px 0 8px; min-width: 20px; text-align: right; white-space: nowrap; }
.CodeMirror-linebackground { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 0; }
.CodeMirror-linewidget { position: relative; z-index: 2; padding: .1px; }
.CodeMirror-rtl pre { direction: rtl; }
.CodeMirror-code { outline: none; }
.CodeMirror-scroll, .CodeMirror-sizer, .CodeMirror-gutter, .CodeMirror-gutters, .CodeMirror-linenumber { box-sizing: content-box; }
.CodeMirror-measure { position: absolute; width: 100%; height: 0; overflow: hidden; visibility: hidden; }
.CodeMirror-measure pre { position: static; }
.CodeMirror-cursor { position: absolute; pointer-events: none; width: 0; border-right: none; }
div.CodeMirror-cursors { visibility: hidden; position: relative; z-index: 3; }
div.CodeMirror-dragcursors { visibility: visible; }
.CodeMirror-focused div.CodeMirror-cursors { visibility: visible; }
.cm-tab { display: inline-block; text-decoration: inherit; }
.cm-tab-wrap-hack:after { content: ''; }

const $ = (id) => document.getElementById(id);

function update() {
  const bill = parseFloat($("bill").value) || 0;
  const tip = parseFloat($("tip").value) || 0;
  const people = Math.max(1, parseInt($("people").value, 10) || 1);

  const total = bill * (1 + tip / 100);
  const each = total / people;

  $("each").textContent = "$" + each.toFixed(2);
  console.log(`Total $${total.toFixed(2)}, split ${people} ways`);
}

for (const id of ["bill", "tip", "people"]) {
  $(id).addEventListener("input", update);
}

update();
</textarea>

<textarea data-path="README.md">
# Pocket Code

A code editor built for your phone.

## Getting around

- **Files button** (top left) opens the explorer. Tap the dots on a row to rename, duplicate or delete.
- **Search bar** (top middle) jumps to any file. Type `>` for commands or `:42` to go to line 42.
- **Play button** runs your HTML, CSS and JavaScript, and shows Markdown as a formatted page.
- **Key row** above the keyboard has Tab, arrows, brackets and undo.

## Running code

Open `index.html` or any file next to it and tap Play.
Linked `.css` and `.js` files from this project are pulled in automatically.
`console.log` output shows up in the Console tab.

Python files get syntax colors but can't run here yet.

## Saving

Everything saves automatically in this browser.
Use **Export ZIP** in the menu for a backup.

      var m = tag.match(/href\s*=\s*["']([^"']+)["']/i);
      var p = m && resolvePath(dir, m[1]);
      if (!p || !(p in state.files)) return tag;
      return '<style data-file="' + escHtml(p) + '">\n' + state.files[p] + '\n</style>';
    });
    src = src.replace(/<script\b([^>]*?)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi, function (all, pre, url, post) {
      var p = resolvePath(dir, url);
      if (!p || !(p in state.files)) return all;
      return '<script' + pre + post + '>\n' + state.files[p].replace(/<\/script/gi, '<\\/script') + '\n<\/script>';
    });
    if (/<head[^>]*>/i.test(src)) src = src.replace(/<head[^>]*>/i, function (m) { return m + BRIDGE; });
    else if (/<html[^>]*>/i.test(src)) src = src.replace(/<html[^>]*>/i, function (m) { return m + BRIDGE; });
    else src = BRIDGE + src;
    return { label: htmlPath, html: src };
  }

  var consoleLines = [], errCount = 0;
  function renderConsole() {
    var box = $('#console');
    box.textContent = '';
    if (!consoleLines.length) { box.appendChild(h('div', 'none', 'Nothing logged yet. console.log output and errors from your page show up here.')); }
    consoleLines.forEach(function (l) { box.appendChild(h('div', 'ln ' + l.type, l.text)); });
    box.scrollTop = box.scrollHeight;
    var badge = $('#errBadge');
    badge.hidden = errCount === 0;
    badge.textContent = errCount;
  }
  function logLine(type, text) {
    if (type === 'debug' || type === 'info') type = 'log';
    consoleLines.push({ type: type, text: text });
    if (consoleLines.length > 500) consoleLines.shift();
    if (type === 'error') errCount++;
    renderConsole();
  }
  window.addEventListener('message', function (e) {
    var frame = $('#frame');
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d || d.__pocket !== 1) return;
    logLine(d.type, (d.args || []).join(' '));
  });

  function run() {
    save();
    var built = buildPreview();
    consoleLines = []; errCount = 0; renderConsole();
    $('#pFile').textContent = built.label;
    var frame = $('#frame');
    frame.srcdoc = built.html;
    $('#preview').hidden = false;
    if (document.activeElement) document.activeElement.blur();
    showPreviewTab('preview');
  }
  function showPreviewTab(which) {
    $('#ptPreview').classList.toggle('on', which === 'preview');
    $('#ptConsole').classList.toggle('on', which === 'console');
    $('#pPreviewBody').hidden = which !== 'preview';
    $('#pConsoleBody').hidden = which !== 'console';
  }
  $('#ptPreview').addEventListener('click', function () { showPreviewTab('preview'); });
  $('#ptConsole').addEventListener('click', function () { showPreviewTab('console'); });
  $('#pReload').addEventListener('click', run);
  $('#pClose').addEventListener('click', function () { $('#preview').hidden = true; $('#frame').srcdoc = ''; });
  $('#consoleForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('#consoleInput').value;
    if (!v.trim()) return;
    logLine('input', '› ' + v);
    try { $('#frame').contentWindow.postMessage({ __pocketEval: v }, '*'); } catch (err) { logLine('error', String(err)); }
    $('#consoleInput').value = '';
  });

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.hidden = false; t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.hidden = true; }, 220); }, 2200);
  }

  /* ---------- Keyboard-aware sizing ---------- */
  var app = $('#app');
  var fitRaf = 0;
  function fit() {
    cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(function () {
      var vv = window.visualViewport;
      if (vv) {
        app.style.height = vv.height + 'px';
        app.style.top = vv.offsetTop + 'px';
        app.classList.toggle('kb', window.innerHeight - vv.height > 140 || (screen.height - vv.height > 260 && cm.hasFocus()));
      }
      cm.refresh();
      if (cm.hasFocus()) cm.scrollIntoView(null, 40);
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
  }
  window.addEventListener('resize', fit);
  cm.on('focus', fit);
  cm.on('blur', fit);

  /* ---------- Wiring ---------- */
  $('#btnFiles').addEventListener('click', openDrawer);
  $('#drawerScrim').addEventListener('click', closeDrawer);
  $('#treeClose').addEventListener('click', closeDrawer);
  $('#treeNewFile').addEventListener('click', function () { newFile(''); });
  $('#treeNewFolder').addEventListener('click', function () { newFolder(''); });
  $('#treeImport').addEventListener('click', function () { importInto(''); });
  $('#btnTitle').addEventListener('click', function () { openPalette(''); });
  $('#btnFind').addEventListener('click', function () { if ($('#findbar').hidden) openFind(); else closeFind(); });
  $('#btnRun').addEventListener('click', run);
  $('#btnMore').addEventListener('click', openSettings);
  $('#emptyNew').addEventListener('click', function () { newFile(''); });
  $('#emptyFiles').addEventListener('click', openDrawer);
  $('#stPos').addEventListener('click', function () { openPalette(':'); });
  $('#stIndent').addEventListener('click', function () { setSetting('tabSize', state.settings.tabSize === 2 ? 4 : 2); toast('Indent with ' + state.settings.tabSize + ' spaces'); });
  $('#stSave').addEventListener('click', function () { if (save()) toast('Saved in this browser'); else toast('Saving is blocked here, so changes last only until you close this page.'); });
  $('#stLang').addEventListener('click', function () { openPalette('>'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (pal) closePalette();
    else if (sheetOpen) closeSheet();
    else if (!$('#preview').hidden) $('#pClose').click();
    else if (drawer.classList.contains('open')) closeDrawer();
  });
  if (!canDownload) $('#storageNote').innerHTML = 'Files save automatically <strong>in this browser</strong> on this device. Use Copy contents on a file to keep a backup.';
  if (!canDownload && window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (ns) {
      if (!ns) return;
      hostSaver = ns;
      $('#storageNote').innerHTML = 'Files save automatically <strong>in this browser</strong> on this device. Export a ZIP from the menu to keep a backup.';
    }, function () {});
  }

  applySettings();
  showEditor(state.active);
  renderTabs();
  renderTree();
  fit();
  if (!save()) setSaveLabel('Not saved');

  if ('serviceWorker' in navigator && isTop && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
<!--ARTIFACT-END-->
</body>
</html>
