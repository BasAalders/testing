* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--editor-bg); color: var(--fg); font: 13px/1.4 var(--font-ui); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
[hidden] { display: none !important; }

.ci { font: normal normal normal 16px/1 codicon; display: inline-block; text-align: center; text-decoration: none; text-rendering: auto;

#app { position: fixed; left: 0; right: 0; top: 0; height: 100%; display: flex; flex-direction: column; background: var(--editor-bg); }

/* Title bar */
.titlebar { flex: none; display: flex; align-items: center; gap: 2px; background: var(--title-bg); color: var(--title-fg);
  border-bottom: 1px solid var(--title-border); min-height: calc(40px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(4px, env(safe-area-inset-right, 0px)) 0 max(4px, env(safe-area-inset-left, 0px)); }
.tb-btn { flex: none; display: grid; place-items: center; width: 38px; height: 34px; border-radius: 5px; color: var(--title-fg); }
.tb-btn:active, .tb-btn.on { background: var(--status-hover); }
.cmdcenter { flex: 1; min-width: 0; max-width: 600px; margin: 0 auto; height: 28px; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 10px; border: 1px solid var(--cc-border); border-radius: 6px; background: var(--cc-bg); color: var(--cc-fg); font-size: 12.5px; }
.cmdcenter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdcenter .ci { font-size: 14px; opacity: .85; }

.workbench { flex: 1; min-height: 0; display: flex; position: relative; }

/* Activity bar */
.activitybar { flex: none; width: 48px; display: flex; flex-direction: column; background: var(--act-bg); border-right: 1px solid var(--act-edge);
  padding-left: env(safe-area-inset-left, 0px); box-sizing: content-box; z-index: 16; }
.act { position: relative; width: 48px; height: 48px; display: grid; place-items: center; color: var(--act-dim); }
.act .ci { font-size: 24px; }
.act.on { color: var(--act-fg); }
.act.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--act-border); }
.act:active { color: var(--act-fg); }
.act-spacer { flex: 1; }

/* Side bar */
.sidebar { flex: none; width: 300px; display: flex; flex-direction: column; background: var(--side-bg); color: var(--side-fg);
  border-right: 1px solid var(--side-border); min-width: 0; }
.side-title { flex: none; height: 35px; display: flex; align-items: center; padding: 0 4px 0 20px; font-size: 11px; letter-spacing: .02em; }
.side-title span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-scrim { display: none; }
@media (max-width: 820px) {
  .sidebar { position: absolute; z-index: 15; top: 0; bottom: 0; left: calc(48px + env(safe-area-inset-left, 0px)); width: min(320px, calc(100% - 96px));
    box-shadow: 0 0 18px rgba(0, 0, 0, .3); }
  .side-scrim { display: block; position: absolute; inset: 0; z-index: 14; background: var(--scrim); }
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--side-border); }
.pane:first-child { border-top: 0; }
.pane.grow { flex: 1; }
.pane-head { flex: none; height: 30px; display: flex; align-items: center; gap: 2px; padding-right: 4px; font-size: 11px; font-weight: 700;
  color: var(--side-head); text-transform: uppercase; letter-spacing: .02em; }
.pane-head > button:first-child { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 2px; text-align: left; overflow: hidden; }
.pane-head > button:first-child span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-head .ci-chevron-right, .pane-head .ci-chevron-down { width: 20px; }
.icon-act { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 5px; color: var(--side-fg); }
.icon-act:active { background: var(--status-hover); }
.icon-act:disabled { opacity: .4; }
.pane-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; }
.pane-body.fixed { flex: none; max-height: 30vh; }

/* Lists and the file tree */
.row { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding-right: 6px; font-size: 13px;
  color: var(--side-fg); text-align: left; white-space: nowrap; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.row:active { background: var(--hover); }
.row.active { background: var(--list-inact); }
.row.sel { background: var(--list-sel); color: var(--list-sel-fg); outline: 1px solid var(--focus); outline-offset: -1px; }
.row .tw { flex: none; width: 16px; display: grid; place-items: center; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .desc { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.sel .desc { color: inherit; opacity: .75; }
.row.err .label { color: var(--err); }
.row .count { flex: none; min-width: 18px; padding: 0 5px; height: 18px; border-radius: 9px; background: var(--badge); color: var(--badge-fg); font-size: 11px; line-height: 18px; text-align: center; }
.row .count.err { background: none; color: var(--err); font-weight: 600; }
.row .rowbtn { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 4px; }
.guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--guide); opacity: .45; }
.fi { flex: none; width: 16px; height: 16px; display: grid; place-items: center; font: 700 8.5px/1 var(--font-mono); letter-spacing: -.04em; }
.fi .ci { font-size: 15px; }
.inline-edit { position: relative; flex: 1; min-width: 0; }
.inline-edit input { width: 100%; height: 24px; padding: 0 4px; border: 1px solid var(--focus); background: var(--input-bg); color: var(--input-fg); font-size: 13px; outline: none; }
.inline-edit .msg { position: absolute; left: 0; right: 0; top: 24px; z-index: 3; padding: 4px 6px; font-size: 12px; white-space: normal;
  background: var(--widget-bg); border: 1px solid var(--err); color: var(--fg); }
.inline-edit.bad input { border-color: var(--err); }
.empty-note { padding: 10px 20px; color: var(--muted); font-size: 13px; line-height: 1.5; white-space: normal; }
.empty-note .btn { margin-top: 10px; width: 100%; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 28px; padding: 4px 12px; border-radius: 2px;
  background: var(--btn); color: var(--btn-fg); font-size: 13px; }
.btn.secondary { background: var(--btn2); color: var(--btn2-fg); }
.btn:active { filter: brightness(1.12); }
.btn.block { width: 100%; }
.field { position: relative; display: flex; align-items: center; min-width: 0; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 2px; }
.field:focus-within { border-color: var(--focus); }
.field.bad { border-color: var(--err); }
.field input { flex: 1; min-width: 0; height: 26px; padding: 0 6px; border: 0; background: transparent; color: var(--input-fg); font-size: 13px; outline: none; }
.field input::placeholder { color: var(--ph); }
.opt { flex: none; width: 22px; height: 22px; margin-right: 2px; display: grid; place-items: center; border-radius: 3px; color: var(--fg); border: 1px solid transparent; }
.opt.on { background: rgba(36, 137, 219, .25); border-color: var(--focus); }

/* Search view */
.search-form { flex: none; display: flex; gap: 2px; padding: 4px 8px 6px 4px; }
.search-form .toggle { width: 16px; display: grid; place-items: start center; padding-top: 6px; color: var(--side-fg); }
.search-form .fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.search-form .repl { display: flex; gap: 2px; align-items: center; }
.search-form .repl .field { flex: 1; }
.search-msg { padding: 2px 20px 6px; color: var(--muted); font-size: 12px; }
.match mark { background: var(--search-hl); color: inherit; border-radius: 1px; }
.match.replaced mark { text-decoration: line-through; }
.match .ins { background: var(--insert-hl); }

/* Run view */
.run-view { padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; }
.run-view p { margin: 0; }
.linkish { color: var(--link); cursor: pointer; }

/* Editor group */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--editor-bg); }
.tabsbar { flex: none; display: flex; height: 35px; background: linear-gradient(to top, var(--tab-border) 1px, var(--tabs-bg) 1px); }
.tabs { flex: 1; min-width: 0; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }

.tab { position: relative; flex: none; display: flex; align-items: center; gap: 6px; height: 35px; max-width: 220px; padding-left: 10px;
  background: var(--tab-bg); color: var(--tab-fg); border-right: 1px solid var(--tab-border); box-shadow: inset 0 -1px 0 var(--tab-border);

.editor-actions { flex: none; display: flex; align-items: center; gap: 1px; padding: 0 4px; }

.editor-area { position: relative; flex: 1; min-height: 0; }

.special { position: absolute; inset: 0; overflow: auto; background: var(--editor-bg); color: var(--fg); }

/* Find widget */
.findw { position: absolute; top: 0; right: 12px; z-index: 9; width: min(420px, calc(100% - 20px)); display: flex; background: var(--widget-bg);
  color: var(--fg); box-shadow: var(--shadow); border-radius: 0 0 4px 4px; padding: 4px 4px 4px 0; }

.findw .frow { display: flex; align-items: center; gap: 2px; }
.findw .field { flex: 1; }

/* Welcome, settings, preview, watermark */
.welcome { max-width: 980px; margin: 0 auto; padding: 28px 20px 40px; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: start; }

.welcome ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.welcome li > button { display: flex; align-items: center; gap: 8px; min-height: 30px; color: var(--link); font-size: 13.5px; text-align: left; }

.tipcard { padding: 10px 12px; border-radius: 6px; background: var(--hover); margin-bottom: 8px; line-height: 1.5; font-size: 13px; }

.welcome .foot { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

.settings { max-width: 900px; margin: 0 auto; padding: 14px 20px 40px; }
.settings > .field { margin-bottom: 14px; }
.settings > .field input { height: 30px; font-size: 14px; }
.setting { position: relative; padding: 10px 12px 12px 14px; margin: 0 -12px; border-radius: 3px; }
.setting.mod::before { content: ""; position: absolute; left: 3px; top: 12px; bottom: 12px; width: 2px; background: var(--accent); }
.setting h3 { margin: 0 0 4px; font-size: 13px; font-weight: 400; }
.setting h3 b { font-weight: 600; }
.setting p { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.45; }
.setting select, .setting input[type="number"] { min-width: 120px; max-width: 100%; height: 26px; padding: 0 6px; background: var(--input-bg); color: var(--input-fg);
  border: 1px solid var(--input-border); border-radius: 2px; font-size: 13px; }
.setting .check { color: var(--muted); }
.settings .group { margin: 18px 0 6px; font-size: 20px; font-weight: 600; }

.preview { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pv-bar { flex: none; display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 6px; background: var(--editor-bg); border-bottom: 1px solid var(--border); }
.pv-bar .field { flex: 1; }
.pv-bar .tb-btn { width: 30px; height: 28px; color: var(--fg); }
#frame { flex: 1; width: 100%; border: 0; background: var(--preview-bg); }

.watermark { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 20px; padding: 24px 16px; color: var(--muted); }
.watermark svg { width: 120px; height: 120px; opacity: .12; }
.watermark dl { display: grid; grid-template-columns: auto auto; gap: 8px 14px; margin: 0; font-size: 13px; }
.watermark dt { text-align: right; }
.watermark dt button { color: var(--muted); }
.watermark dd { margin: 0; }
kbd { display: inline-block; min-width: 18px; padding: 1px 5px; border: 1px solid var(--input-border); border-bottom-width: 2px; border-radius: 3px;
  background: var(--hover); color: var(--fg); font: 11px/1.4 var(--font-ui); text-align: center; vertical-align: middle; }

/* Panel */
.panel { flex: 0 0 42%; min-height: 0; display: flex; flex-direction: column; background: var(--panel-bg); border-top: 1px solid var(--panel-border); }
.panel.max { flex: 1 1 auto; }
.main.pmax .editor-area, .main.pmax .crumbs, .main.pmax .tabsbar { display: none; }
.panel-head { flex: none; display: flex; align-items: center; height: 35px; padding-right: 4px; }
.ptabs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-left: 8px; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex: none; position: relative; height: 35px; padding: 0 9px; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--panel-tab);
  text-transform: uppercase; letter-spacing: .02em; }
.ptab.on { color: var(--panel-tab-act); }

.pbadge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--badge); color: var(--badge-fg); font-size: 11px; line-height: 18px; text-align: center; }

.pbody { flex: 1; min-height: 0; overflow: auto; font-size: 13px; }

.out { padding: 4px 0; font: 12.5px/1.5 var(--font-mono); }

.out .ln.dir { color: var(--info); }

.cline { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-top: 1px solid var(--panel-border); }
.cline .prompt { color: var(--link); font: 600 12.5px var(--font-mono); white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.cline input { flex: 1; min-width: 0; height: 28px; border: 0; background: transparent; color: var(--term-fg); font: 13px var(--font-mono); outline: none; }
.term-wrap { display: flex; flex-direction: column; height: 100%; background: var(--term-bg); color: var(--term-fg); }

/* Key row */
.keys { flex: none; display: flex; gap: 4px; overflow-x: auto; padding: 5px 6px; background: var(--side-bg); border-top: 1px solid var(--border); scrollbar-width: none; }

  border-top: 1px solid var(--status-border); font-size: 12px; min-height: calc(24px + env(safe-area-inset-bottom, 0px));
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0; }

@media (max-width: 520px) { .statusbar .wide-only { display: none; } }

/* Menus, quick input, dialogs, notifications */
.layer { position: fixed; inset: 0; z-index: 70; }
.menu { position: absolute; min-width: 220px; max-width: calc(100vw - 16px); max-height: calc(100% - 16px); overflow-y: auto; padding: 4px 0;

.quick { position: absolute; left: 50%; top: calc(6px + env(safe-area-inset-top, 0px)); width: min(600px, calc(100% - 16px)); transform: translateX(-50%); display: flex; flex-direction: column;

.qi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 3px 11px; text-align: left; color: var(--fg); }
.qi.hot { background: var(--list-sel); color: var(--list-sel-fg); }

.dialog-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.dialog { width: min(460px, 100%); background: var(--widget-bg); color: var(--fg); border: 1px solid var(--widget-border); border-radius: 6px; box-shadow: var(--shadow); padding: 18px; }

.toasts { position: fixed; right: 8px; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 6px;
  width: min(420px, calc(100% - 16px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 10px 6px 10px 12px; background: var(--widget-bg); color: var(--fg);
  border: 1px solid var(--widget-border); border-radius: 6px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.45; }

.toast .ci.info { color: var(--info); } .toast .ci.warn { color: var(--warn); } .toast .ci.error { color: var(--err); }

const $ = (id) => document.getElementById(id);

function update() {
  const bill = parseFloat($("bill").value) || 0;
  const tip = parseFloat($("tip").value) || 0;
  const people = Math.max(1, parseInt($("people").value, 10) || 1);

  const total = bill * (1 + tip / 100);
  const each = total / people;

  $("each").textContent = "$" + each.toFixed(2);
  console.log(`Total $${total.toFixed(2)}, split ${people} ways`);
}

for (const id of ["bill", "tip", "people"]) {
  $(id).addEventListener("input", update);
}

update();

function fizzbuzz(n) {
  if (n % 15 === 0) return "FizzBuzz";
  if (n % 3 === 0) return "Fizz";
  if (n % 5 === 0) return "Buzz";
  return String(n);
}

for (let i = 1; i <= 15; i++) {
  console.log(fizzbuzz(i));

<textarea data-path="README.md">
# Pocket Code

A VS Code style editor for your phone.

## Getting around

- **Activity bar** (left edge): Explorer, Search and Run and Debug. Tap the active icon again to hide the side bar.
- **Command center** (top middle): type a file name, `>` for commands, `:` for a line number, `@` for symbols.
- **Long-press** a file, folder or tab for its context menu.
- **Panel** (top right button): Problems, Output, Debug Console and Terminal.
- **Key row**: appears above the keyboard with Tab, arrows, brackets and undo.

## Running code

Tap the play button next to the tabs to preview `index.html`. Linked `.css` and `.js` files from this project are pulled in automatically.

The Terminal has a small built-in shell. Try `ls`, `cd scripts`, `node fizzbuzz.js` or `help`.

Python files get syntax colors but can't run here.

## Saving

Everything saves automatically in this browser. Use **File > Export Project as ZIP** for a backup.

  function about() {

      detail: 'A VS Code style editor for phones. Editor: CodeMirror 5.65.16 (MIT). Icons: Codicons by Microsoft (CC BY 4.0). Syntax checks: Acorn (MIT). Pocket Code is not affiliated with Microsoft or Visual Studio Code.' });
  }

  /* ---------- Command registry ---------- */
  cmd('newFile', 'File: New File...', () => { if (state.ui.sidebar && state.ui.view === 'explorer') startEdit('file', selectedFolder()); else askName('New File...', 'Enter a file name, like main.js or src/app.py', fileActive() ? parentOf(state.active) : '', createFile); }, 'Mod+Alt+N');
  cmd('newFolder', 'File: New Folder...', () => { if (state.ui.sidebar && state.ui.view === 'explorer') startEdit('folder', selectedFolder()); else askName('New Folder...', 'Enter a folder name', '', createFolder); });
  cmd('save', 'File: Save', () => { if (save()) notify('Saved. Pocket Code also saves automatically.'); }, 'Mod+S');
  cmd('import', 'File: Import Files...', () => importInto(''));
  cmd('export', 'File: Export Project as ZIP', exportZip, null, canExport);
  cmd('reset', 'File: Reset to Starter Project...', resetProject);
  cmd('copyFile', 'File: Copy Contents of Active File', () => copyText(cm.getValue(), 'Copied ' + baseOf(state.active)), null, fileActive);
  cmd('copyPath', 'File: Copy Path of Active File', () => copyText('/' + state.active, 'Copied path'), null, fileActive);
  cmd('rename', 'File: Rename...', () => startEdit('rename', null, state.active), 'F2', fileActive);
  cmd('closeEditor', 'View: Close Editor', () => closeTab(state.active), 'Mod+W', () => !!state.active);
  cmd('closeAll', 'View: Close All Editors', () => closeTabs(state.open));
  cmd('quickOpen', 'Go to File...', () => quickOpen(''), 'Mod+P');
  cmd('commands', 'Show All Commands', () => quickOpen('>'), 'Mod+Shift+P');
  cmd('gotoLine', 'Go to Line/Column...', () => quickOpen(':'), 'Ctrl+G', fileActive);
  cmd('gotoSymbol', 'Go to Symbol in Editor...', () => quickOpen('@'), 'Mod+Shift+O', fileActive);
  cmd('nextProblem', 'Go to Next Problem (Error, Warning, Info)', () => nextProblem(1), 'F8');
  cmd('prevProblem', 'Go to Previous Problem (Error, Warning, Info)', () => nextProblem(-1), 'Shift+F8');
  cmd('find', 'Find', () => openFind(), 'Mod+F', fileActive);
  cmd('replace', 'Replace', () => openFind(true), 'Mod+H', fileActive);
  cmd('findInFiles', 'Search: Find in Files', () => findInFiles(), 'Mod+Shift+F');
  cmd('replaceInFiles', 'Search: Replace in Files', () => findInFiles(true), 'Mod+Shift+H');
  cmd('comment', 'Toggle Line Comment', () => cm.toggleComment(), 'Mod+/', fileActive);
  cmd('blockComment', 'Toggle Block Comment', () => {
    const from = cm.getCursor('from'), to = cm.getCursor('to');
    if (!cm.uncomment(from, to)) cm.blockComment(from, to, { fullLines: false });
  }, 'Shift+Alt+A', fileActive);
  cmd('moveLineUp', 'Move Line Up', () => moveLines(-1), 'Alt+ArrowUp', fileActive);
  cmd('moveLineDown', 'Move Line Down', () => moveLines(1), 'Alt+ArrowDown', fileActive);
  cmd('copyLineUp', 'Copy Line Up', () => copyLines(-1), 'Shift+Alt+ArrowUp', fileActive);
  cmd('copyLineDown', 'Copy Line Down', () => copyLines(1), 'Shift+Alt+ArrowDown', fileActive);
  cmd('deleteLine', 'Delete Line', () => cm.execCommand('deleteLine'), 'Mod+Shift+K', fileActive);
  cmd('selectAll', 'Select All', () => cm.execCommand('selectAll'), 'Mod+A', fileActive);
  cmd('indentLines', 'Indent Line', () => cm.execCommand('indentMore'), 'Mod+]', fileActive);
  cmd('outdentLines', 'Outdent Line', () => cm.execCommand('indentLess'), 'Mod+[', fileActive);
  cmd('changeLang', 'Change Language Mode', languagePicker, null, fileActive);
  cmd('indentPick', 'Indent Using Spaces', indentPicker, null, fileActive);
  cmd('wordWrap', 'View: Toggle Word Wrap', () => setSetting('wrap', state.settings.wrap === 'on' ? 'off' : 'on'), 'Alt+Z');
  cmd('toggleSidebar', 'View: Toggle Primary Side Bar Visibility', () => { if (state.ui.sidebar) setSidebar(false); else showView(state.ui.view); }, 'Mod+B');
  cmd('togglePanel', 'View: Toggle Panel Visibility', () => togglePanel(), 'Mod+J');
  cmd('maxPanel', 'View: Toggle Maximized Panel', () => { state.ui.pmax = !state.ui.pmax; openPanel(); });
  cmd('showExplorer', 'View: Show Explorer', () => showView('explorer'), 'Mod+Shift+E');
  cmd('showRun', 'View: Show Run and Debug', () => showView('run'), 'Mod+Shift+D');
  cmd('showProblems', 'View: Focus Problems', () => openPanel('problems'), 'Mod+Shift+M');
  cmd('showOutput', 'View: Toggle Output', () => togglePanel('output'));
  cmd('showDebug', 'View: Toggle Debug Console', () => togglePanel('debug'));
  cmd('toggleTerminal', 'View: Toggle Terminal', () => togglePanel('terminal'), 'Ctrl+`');
  cmd('newTerminal', 'Terminal: Create New Terminal', newTerminal, 'Ctrl+Shift+`');
  cmd('clearTerminal', 'Terminal: Clear', () => { $('#termOut').textContent = ''; });
  cmd('zoomIn', 'View: Zoom In', () => setSetting('fontSize', Math.min(32, state.settings.fontSize + 1)), 'Mod+=');
  cmd('zoomOut', 'View: Zoom Out', () => setSetting('fontSize', Math.max(8, state.settings.fontSize - 1)), 'Mod+-');
  cmd('zoomReset', 'View: Reset Zoom', () => setSetting('fontSize', DEFAULT_SETTINGS.fontSize), 'Mod+0');
  cmd('keyRow', 'View: Toggle Key Row', () => setSetting('keys', state.settings.keys === 'never' ? 'auto' : 'never'));
  cmd('theme', 'Preferences: Color Theme', themePicker, 'Mod+K Mod+T');
  cmd('settings', 'Preferences: Open Settings (UI)', () => openFile('@settings'), 'Mod+,');
  cmd('welcome', 'Help: Welcome', () => openFile('@welcome'));
  cmd('about', 'Help: About', about);
  cmd('run', 'Debug: Start Debugging', () => runPreview(), 'F5');
  cmd('runNoDebug', 'Debug: Run Without Debugging', () => runPreview(), 'Ctrl+F5');
  cmd('runTerminal', 'Run Active File in Terminal', () => runInTerminal(), null, fileActive);
  cmd('markdownPreview', 'Markdown: Open Preview', () => runPreview(), 'Mod+Shift+V', () => fileActive() && /\.(md|markdown)$/i.test(state.active));

  /* ---------- Global keyboard shortcuts ---------- */
  const CODE_KEYS = { Slash: '/', Equal: '=', Minus: '-', Backquote: '`', Comma: ',', BracketLeft: '[', BracketRight: ']', Period: '.' };
  function comboOf(e) {
    let k = /^Key[A-Z]$/.test(e.code || '') ? e.code.slice(3) : /^Digit\d$/.test(e.code || '') ? e.code.slice(5) : CODE_KEYS[e.code] || e.key;
    if (k && k.length === 1) k = k.toUpperCase();
    const parts = [];
    if (isMac ? e.metaKey : e.ctrlKey) parts.push('Mod');
    if (isMac && e.ctrlKey) parts.push('Ctrl');
    if (e.shiftKey) parts.push('Shift');
    if (e.altKey) parts.push('Alt');
    parts.push(k);
    return parts.join('+');
  }
  function norm(s) {
    const p = s.split('+'); const k = p.pop();
    const has = (m) => p.indexOf(m) >= 0;
    const mods = [];
    if (has('Mod') || (!isMac && has('Ctrl'))) mods.push('Mod');
    if (isMac && has('Ctrl')) mods.push('Ctrl');
    if (has('Shift')) mods.push('Shift');
    if (has('Alt')) mods.push('Alt');
    return mods.concat([k.length === 1 ? k.toUpperCase() : k]).join('+');
  }
  const KEYMAP = {};
  Object.values(CMDS).forEach((c) => { if (c.kb && c.kb.indexOf(' ') < 0) KEYMAP[norm(c.kb)] = c.id; });
  KEYMAP[norm('Mod+Shift+F')] = 'findInFiles';
  KEYMAP[norm('F1')] = 'commands';
  KEYMAP[norm('Mod+Alt+F')] = 'replace';
  const EDITOR_ONLY = new Set(['comment', 'blockComment', 'moveLineUp', 'moveLineDown', 'copyLineUp', 'copyLineDown', 'deleteLine', 'selectAll', 'indentLines', 'outdentLines']);
  let chord = false;
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (quick) { e.preventDefault(); closeQuick(true); return; }
      if (menuLayer) { e.preventDefault(); closeMenu(); return; }
      if (!$('#findw').hidden && cm.hasFocus()) { closeFind(); return; }
      if (state.ui.sidebar && narrow()) { setSidebar(false); return; }
      return;
    }
    if (quick || menuLayer || document.querySelector('.dialog-layer')) return;
    if (/^(Shift|Control|Alt|Meta)$/.test(e.key)) return;
    const combo = comboOf(e);
    if (chord) { chord = false; if (combo === norm('Mod+T')) { e.preventDefault(); themePicker(); } return; }
    if (combo === norm('Mod+K')) { e.preventDefault(); chord = true; return; }
    const id = KEYMAP[combo];
    if (!id) return;
    if (EDITOR_ONLY.has(id) && !cm.hasFocus()) return;
    if (id === 'rename' && (cm.hasFocus() || (e.target && e.target.closest && e.target.closest('.row')))) return;
    const inField = e.target && e.target.matches && e.target.matches('input, textarea, select');
    if (inField && /^(Alt\+Z|Mod\+A)$/.test(combo)) return;
    if (runCmd(id)) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* ---------- Title bar and status bar wiring ---------- */
  $('#btnMenu').addEventListener('click', (e) => { const r = e.currentTarget.getBoundingClientRect(); appMenu({ x: r.left, y: r.bottom + 2 }); });
  $('#btnCmd').addEventListener('click', () => quickOpen(''));
  $('#btnPanel').addEventListener('click', () => togglePanel());
  $('#btnRun').addEventListener('click', () => runPreview());
  $('#btnManage').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu([
      { label: 'Command Palette...', kb: 'Mod+Shift+P', run: () => quickOpen('>') },
      '-',
      { label: 'Settings', kb: 'Mod+,', run: () => openFile('@settings') },
      { label: 'Themes', submenu: themeItems },
      '-',
      { label: 'Welcome', run: () => openFile('@welcome') },
      { label: 'About', run: about }
    ], { x: r.right + 4, y: r.bottom - 220 });
  });
  $('#btnEdMore').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const fa = fileActive();
    showMenu([
      { label: 'Find', kb: 'Mod+F', disabled: !fa, run: () => openFind() },
      { label: 'Replace', kb: 'Mod+H', disabled: !fa, run: () => openFind(true) },
      { label: 'Go to Symbol...', kb: 'Mod+Shift+O', disabled: !fa, run: () => quickOpen('@') },
      { label: 'Go to Line/Column...', kb: 'Ctrl+G', disabled: !fa, run: () => quickOpen(':') },
      '-',
      { label: 'Word Wrap', checked: state.settings.wrap === 'on', kb: 'Alt+Z', run: () => runCmd('wordWrap') },
      { label: 'Copy Contents', disabled: !fa, run: () => runCmd('copyFile') },
      '-',
      { label: 'Close All', run: () => closeTabs(state.open) },
      { label: 'Close Others', disabled: !state.active, run: () => closeTabs(state.open.filter((o) => o !== state.active)) }
    ], { x: r.right - 260, y: r.bottom });
  });
  $('#sbProblems').addEventListener('click', () => togglePanel('problems'));
  $('#sbPos').addEventListener('click', () => quickOpen(':'));
  $('#sbIndent').addEventListener('click', indentPicker);
  $('#sbEnc').addEventListener('click', () => notify('Pocket Code saves files as UTF-8.'));
  $('#sbEol').addEventListener('click', () => notify('Pocket Code uses LF line endings.'));
  $('#sbLang').addEventListener('click', languagePicker);
  $('#sbBell').addEventListener('click', (e) => {
    unread = 0; updateBell();
    const r = e.currentTarget.getBoundingClientRect();
    const items = notes.length ? notes.slice(0, 8).map((n) => ({ label: n.msg, disabled: true })).concat(['-', { label: 'Clear All Notifications', run: () => { notes.length = 0; } }]) : [{ label: 'No New Notifications', disabled: true }];
    showMenu(items, { x: r.right - 300, y: r.top - 8 - (items.length * 34) });
  });
  $('#sbRemote').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu([
      { label: 'Workspace is stored in this browser', disabled: true },
      '-',
      { label: 'Import Files...', run: () => importInto('') },
      canExport() && { label: 'Export Project as ZIP', run: exportZip },
      { label: 'Reset to Starter Project...', run: resetProject }
    ], { x: r.left, y: r.top - 190 });
  });
  $('#runBtnBig').addEventListener('click', () => { if (narrow()) setSidebar(false); runPreview(); });
  $('#runInTerm').addEventListener('click', () => { if (narrow()) setSidebar(false); runInTerminal(); });
  $('#runOpenDbg').addEventListener('click', () => { if (narrow()) setSidebar(false); openPanel('debug'); });
  $('#runOpenTerm').addEventListener('click', () => { if (narrow()) setSidebar(false); openPanel('terminal'); });

  /* ---------- Keyboard-aware sizing ---------- */
  const app = $('#app');
  let fitRaf = 0;
  function fit() {
    cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(() => {
      const vv = window.visualViewport;
      if (vv) {
        app.style.height = vv.height + 'px';
        app.style.top = vv.offsetTop + 'px';
        app.classList.toggle('kb', window.innerHeight - vv.height > 140 || (coarse && editorFocus));
      }
      $('#sideScrim').hidden = !state.ui.sidebar || !narrow();
      cm.refresh();
      if (cm.hasFocus()) cm.scrollIntoView(null, 40);
    });
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);

  /* ---------- Android app bridge ---------- */
  window.__pocketSave = () => { save(); return true; };
  window.__pocketSaved = (ok) => notify(ok ? 'Saved ' + WORKSPACE + '.zip' : 'Export canceled.', ok ? 'info' : 'warn');
  window.__pocketBack = () => {
    const dlg = document.querySelector('.dialog-layer');
    if (dlg) { const b = dlg.querySelector('.btn.secondary') || dlg.querySelector('.btn'); if (b) b.click(); return true; }
    if (quick) { closeQuick(true); return true; }
    if (menuLayer) { closeMenu(); return true; }
    if (editing) { editing = null; renderTree(); return true; }
    if (!$('#findw').hidden) { closeFind(true); return true; }
    if (state.ui.sidebar && narrow()) { setSidebar(false); return true; }
    if (state.ui.panel) { closePanel(); return true; }
    if (state.active === '@preview') { closeTab('@preview'); return true; }
    return false;
  };

  /* ---------- Boot ---------- */
  if (!canDownload && window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((ns) => { if (ns) hostSaver = ns; }, () => {});
  }
  if (!state.welcomeShown && state.settings.startup === 'welcomePage' && state.open.indexOf('@welcome') < 0) state.open.unshift('@welcome');
  state.welcomeShown = true;
  const wantSidebar = state.ui.sidebar && !narrow();
  applySettings();
  lintAll();
  showActive();
  renderTabs();
  showView(state.ui.view);
  setSidebar(wantSidebar);
  if (state.ui.panel) openPanel(state.ui.ptab);
  fit();
  save();
  log('Pocket Code started with ' + Object.keys(state.files).length + ' files in this browser.');

  if ('serviceWorker' in navigator && isTop && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
